name: Realistic Auto Commit

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Random Commits
        run: |
          # 1. Xác định tỉ lệ (80% có commit)
          if [ $(( $RANDOM % 10 )) -gt 1 ]; then
            
            # 2. Tạo số lượng commit ngẫu nhiên từ 1 đến 5
            NUM=$((1 + $RANDOM % 5))
            echo "Hôm nay sẽ thực hiện $NUM commits"
            
            # Sử dụng seq để tạo vòng lặp an toàn trong YAML
            for i in $(seq 1 $NUM)
            do
              echo "Cập nhật lúc: $(date +'%Y-%m-%d %H:%M:%S') - Lần: $i" >> daily_log.txt
              git config --local user.email "action@github.com"
              git config --local user.name "github-actions[bot]"
              git add daily_log.txt
              git commit -m "docs: cập nhật tài liệu hệ thống $(date +'%d/%m/%Y %H:%M')"
              
              sleep $((RANDOM % 5)) 
            done
            
            git push
          else
            echo "Hôm nay nghỉ xả hơi."
          fi